# Install only in the reviewed ephemeral guest image; never apply to a workstation or host.
# Base-image policy: no inbound, outbound, or forwarding traffic by default.
# The approved controller /32 rules are inserted from cloud-init only after
# the per-run controller IP has passed RFC1918/VPC validation.

table inet brz {
  chain input {
    type filter hook input priority filter; policy drop;
    iifname "lo" accept
    ct state established,related accept
  }

  chain output {
    type filter hook output priority filter; policy drop;
    oifname "lo" accept
    ct state established,related accept
    ip daddr 169.254.169.254 tcp dport 80 accept
  }

  chain forward {
    type filter hook forward priority filter; policy drop;
  }
}
