# Install only in the reviewed ephemeral guest image; never apply to a workstation or host.
# Boot-time policy: default drop everywhere. Only DHCP and the link-local metadata endpoint are open so the
# private VPC address and cloud-init user data can arrive. The per-run cloud-init (backend/vultr-adapter.mjs)
# FLUSHES the input and output chains before the agent starts and re-adds only loopback, established traffic and
# the controller /32 on port 4174, so DHCP and metadata are closed again. The guest agent refuses to listen
# unless `nft list ruleset` shows exactly that final policy.

table inet brz {
  chain input {
    type filter hook input priority filter; policy drop;
    iifname "lo" accept
    ct state established,related accept
    udp sport 67 udp dport 68 accept
  }

  chain output {
    type filter hook output priority filter; policy drop;
    oifname "lo" accept
    ct state established,related accept
    udp sport 68 udp dport 67 accept
    ip daddr 169.254.169.254 tcp dport 80 accept
  }

  chain forward {
    type filter hook forward priority filter; policy drop;
  }
}
