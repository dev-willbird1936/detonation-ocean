<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RetroDiffusion — Detailed Lite Anglerfish</title>
<script type="module" src="https://unpkg.com/@google/model-viewer@4.1.0/dist/model-viewer.min.js"></script>
<style>body{margin:0;background:#0d151e;color:#d7e8e7;font:16px system-ui}main{max-width:1200px;margin:auto;padding:24px}h1{font-size:25px;margin:0}p{color:#a4bdc2}model-viewer{display:block;width:100%;height:72vh;min-height:360px;background:radial-gradient(ellipse,#243c46,#0d151e 70%);border:1px solid #304751;border-radius:12px}nav{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:16px}button,a,select{padding:10px 16px;background:#20383c;border:1px solid #507575;border-radius:6px;color:#d7e8e7;font:inherit}a{text-decoration:none}</style></head>
<body><main><h1>RetroDiffusion Anglerfish</h1><p>Detailed Lite · 586 triangles · 15 rigid controls · 3 custom clips + original swim · No extra API charges</p>
<model-viewer id="fish" src="./anglerfish-custom.glb" poster="./preview.png" alt="RetroDiffusion-generated low-poly anglerfish" camera-controls autoplay interaction-prompt="none" camera-orbit="-45deg 75deg auto" exposure="1.1"></model-viewer>
<nav><label>Animation <select id="clips" aria-label="Animation"></select></label><button id="pause">Pause</button><a href="./anglerfish-custom.glb" download>Download animated GLB</a><a href="./anglerfish.glb" download>Provider original</a><a href="../viewer.html">Original model</a><span id="status" role="status">Loading…</span></nav></main>
<script type="module">const fish=document.querySelector('#fish'),clips=document.querySelector('#clips'),pause=document.querySelector('#pause'),status=document.querySelector('#status');fish.addEventListener('load',()=>{clips.replaceChildren(...fish.availableAnimations.map(name=>new Option(name,name)));if(fish.availableAnimations.includes('Hover_Idle'))clips.value='Hover_Idle';if(clips.value){fish.animationName=clips.value;fish.play();}status.textContent='Ready — '+(clips.value||'static model');window.anglerfishReady=true;});fish.addEventListener('error',()=>status.textContent='Model could not load. Check the connection and reload.');function play(){fish.play({repetitions:clips.value==='Bite_Snap'?1:Infinity});pause.textContent='Pause';status.textContent='Playing — '+clips.value;}clips.addEventListener('change',()=>{fish.pause();fish.animationName=clips.value;fish.currentTime=0;play();});pause.addEventListener('click',()=>{if(fish.paused){if(fish.currentTime>=fish.duration-.01)fish.currentTime=0;play();}else{fish.pause();pause.textContent='Resume';}});fish.addEventListener('finished',()=>{pause.textContent='Replay';status.textContent='Bite complete';});</script></body></html>
